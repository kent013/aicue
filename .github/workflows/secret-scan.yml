# Plain API key / トークン leak の advisory スキャン。
#
# `plainToken` (API キー・招待トークン等の平文シークレット) が禁止 sink
# (Inertia::render / JsonResource::make / Log::info / throw new) の近傍に現れる
# コミットを grep で検知する non-blocking PR advisory。平文トークンは発行直後の
# 応答 (signed URL / メール等) 以外に露出させてはならず、本 step は将来の誤用
# (props / レスポンス / ログへの混入) をコミット直前に目視補完する advisory に過ぎない。
# 主検証は Feature テスト (Log::spy / Inertia props 検査) が担う。
#
# continue-on-error + 常に `exit 0` で終了するため、false positive があっても PR をブロックしない。
# grep は単一行前提なので、複数行に分離されたパターンは取りこぼす可能性がある。

name: Secret leak advisory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: plainToken misuse advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Grep plainToken near forbidden sinks
        run: |
          set +e
          # grep BRE/ERE では `\s` が使えないため `[[:space:]]` を使う。
          # 単一行で plainToken と sink がどちらの順序でも現れるパターンを検出する。
          FORWARD='plainToken.*(Inertia::render|JsonResource::make|Log::info|throw[[:space:]]+new)'
          BACKWARD='(Inertia::render|JsonResource::make|Log::info|throw[[:space:]]+new).*plainToken'
          HITS=$(grep -rnE "$FORWARD|$BACKWARD" app/ resources/ 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::warning::plainToken が禁止 sink (Inertia::render / JsonResource::make / Log::info / throw new) の近傍で検出されました。Feature テスト (Log::spy / Inertia props) で確認してください。"
            printf '%s\n' "$HITS" | while IFS= read -r line; do
              echo "::warning::$line"
            done
          fi
          exit 0
